plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mira.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mira.ai'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
